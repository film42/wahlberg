[package]
name = "walburg-derive"
version = "0.1.0"
edition = "2024"
description = "#[derive(Record)] for the walburg store"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Dev-only cycle (walburg depends on this crate): lets compile-fail tests
# exercise the macro exactly as users see it.
walburg = { path = ".." }
serde = { version = "1", features = ["derive"] }
trybuild = "1"
