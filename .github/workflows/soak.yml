name: Soak

# Long fuzz + lifecycle-simulation runs: far more cases than a normal
# `cargo test`. New random seeds every night; a failure prints the seed and
# the exact command to replay it.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      fuzz_iters:
        description: "Fuzzer iterations"
        default: "20000"
      sim_runs:
        description: "Simulation runs"
        default: "20"
      sim_steps:
        description: "Steps per simulation run"
        default: "5000"

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FUZZ_ITERS: ${{ inputs.fuzz_iters || '20000' }}
      SIM_RUNS: ${{ inputs.sim_runs || '20' }}
      SIM_STEPS: ${{ inputs.sim_steps || '5000' }}
      SIM_SESSIONS: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test fuzz --test sim -- --nocapture
