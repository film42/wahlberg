[workspace]
members = ["walburg-derive"]
default-members = [".", "walburg-derive"]

[package]
name = "walburg"
version = "0.1.0"
edition = "2024"

[features]
default = ["derive"]
derive = ["dep:walburg-derive"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.35", features = ["bundled"] }
walburg-derive = { path = "walburg-derive", version = "0.1.0", optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "wal-exporter"
path = "examples/wal_exporter.rs"

[[example]]
name = "wal-tail"
path = "examples/wal_tail.rs"

[[example]]
name = "records"
path = "examples/records.rs"
